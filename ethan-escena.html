<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inducción con Ethan</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{--g:#76B82A;--g2:#8fd14f;--gd:#2E6B1F;--ink:#0f2416;--ink2:#3d4b43;--bg:#f6f8f3;--card:#fff;--line:#e3e9df;--chip:#e8f2dc;--green:#3D7A20;--green2:#5BA832;--aqua:#86BF3E;--or:#FF7A18}
html[data-theme=dark]{--ink:#e8f0e6;--ink2:#a9b8ad;--bg:#0a140b;--card:#122014;--line:#223524;--chip:rgba(143,209,79,.16);--gd:#9fd86a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink)}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:visible}
body.w #root{width:1920px;height:1080px}
#halo{position:absolute;left:20px;top:340px;width:1040px;height:1040px;pointer-events:none;background:radial-gradient(closest-side,rgba(118,184,42,.3),rgba(118,184,42,.12) 55%,transparent 72%)}
body.w #halo{left:330px;top:-80px;width:1260px;height:1260px}
html[data-theme=dark] #halo{opacity:.7}
#ctl{position:absolute;left:10px;right:10px;bottom:8px;height:40px;display:flex;align-items:center;gap:10px;padding:0 10px 0 6px;border-radius:99px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s;z-index:20}
body.started #ctl{opacity:1}
#pp{width:30px;height:30px;border-radius:50%;border:0;background:var(--g);color:#0d1a0e;cursor:pointer;font:800 13px system-ui;display:grid;place-items:center;flex:none}
#sk{position:relative;flex:1;height:18px;cursor:pointer}
#sk:before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:4px;background:var(--line)}
#skf{position:absolute;left:0;top:7px;height:4px;border-radius:4px;background:var(--g);width:0}
#tm{font:700 12px "Instrument Sans";color:var(--ink2);min-width:74px;text-align:right}
#big{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:20;border:0;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 24px 14px 16px;border-radius:99px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font:800 17px Archivo;box-shadow:0 18px 40px -10px rgba(61,122,32,.7)}
#big i{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-style:normal;font-size:14px;padding-left:2px}
body.started #big{display:none}
#cta{font-family:Archivo}

*{box-sizing:border-box;margin:0;padding:0}
/* ---- iPhone 17 Pro Max ---- */
#stage{position:absolute;left:0;top:430px;width:1080px;height:960px;perspective:1900px}
#phone{position:absolute;left:315px;top:0;width:450px;height:948px;transform-style:preserve-3d}
.sl{position:absolute;inset:0;border-radius:70px;background:linear-gradient(135deg,#f6a06a,#d2561f 45%,#b8441a 70%,#f0905a)}
.face{position:absolute;inset:0;border-radius:70px;backface-visibility:hidden}
.front{transform:translateZ(24px);background:linear-gradient(135deg,#f8aa72 0%,#d95b22 38%,#c24c1b 62%,#f19a63 100%);box-shadow:0 70px 120px rgba(10,46,35,.3),inset 0 0 0 2px rgba(255,255,255,.35)}
.bezel{position:absolute;inset:9px;border-radius:62px;background:#04070a}
.screen{position:absolute;inset:5px;border-radius:57px;overflow:hidden;background:#fff}
.screen img{position:absolute;left:0;top:0;width:100%;height:100%}
.island{position:absolute;left:50%;top:15px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000;z-index:4}
.island::after{content:"";position:absolute;right:12px;top:10px;width:13px;height:13px;border-radius:50%;background:radial-gradient(#243a52,#0a1119)}
.btn{position:absolute;width:6px;border-radius:3px;background:linear-gradient(90deg,#c2531d,#f29b63)}
.back{transform:rotateY(180deg) translateZ(24px);background:linear-gradient(165deg,#f5a468,#e5863f 45%,#d06f2e 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.plat{position:absolute;left:0;right:0;top:0;height:316px;border-radius:70px 70px 46px 46px;background:linear-gradient(170deg,#f7ad74 0%,#e98d48 60%,#df7c38 100%);box-shadow:inset 0 0 0 2px rgba(255,214,180,.55),inset 0 -6px 14px rgba(150,60,10,.25),0 10px 22px rgba(120,45,5,.3)}.pane{position:absolute;left:22px;right:22px;top:336px;bottom:22px;border-radius:50px;background:linear-gradient(180deg,#f3a468 0%,#e88f4d 55%,#e08040 100%);box-shadow:inset 0 0 0 2px rgba(255,220,190,.35),inset 0 8px 18px rgba(255,235,210,.25),inset 0 -8px 16px rgba(150,60,10,.18)}.pane svg{position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;fill:rgba(255,222,190,.82);filter:drop-shadow(0 1px 0 rgba(150,60,10,.25))}.dot{position:absolute;border-radius:50%}
.lens{position:absolute;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#4a5766 0,#141b23 38%,#05080b 72%);box-shadow:0 0 0 7px #f2b184,0 0 0 10px #a95320,0 0 0 12px #f7c9a3,0 8px 12px rgba(80,30,0,.45),inset 0 0 0 5px #0b0f14}
.lens::after{content:"";position:absolute;left:28%;top:24%;width:20px;height:14px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-30deg)}
.flash{position:absolute;width:30px;height:30px;border-radius:50%;background:#fbe3c9;box-shadow:inset 0 0 0 4px #d98a55}
.mark{position:absolute;left:50%;top:56%;width:210px;margin-left:-105px;padding:18px 20px;border-radius:30px;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.mark img{width:100%;display:block}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:3;color:#fff;font:700 19px "Instrument Sans";display:flex;justify-content:space-between;align-items:center;padding:6px 40px 0 44px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.status .ic{display:flex;gap:7px;align-items:center}
.status .ic i{display:block;background:#fff;border-radius:2px}
.home{position:absolute;left:50%;bottom:9px;width:150px;height:6px;margin-left:-75px;border-radius:4px;background:rgba(255,255,255,.92);z-index:3;box-shadow:0 0 6px rgba(0,0,0,.4)}
.glass{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 46%,rgba(255,255,255,0) 60%);background-size:300% 100%;mix-blend-mode:screen}
.rim{position:absolute;inset:0;border-radius:70px;pointer-events:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.25)}
.gloss{position:absolute;inset:0;border-radius:70px;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0) 40%,rgba(0,0,0,.12))}
#gshadow{position:absolute;left:300px;top:1368px;width:480px;height:70px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(10,46,35,.42),rgba(10,46,35,0) 70%);filter:blur(8px)}
#tapA{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:7px solid var(--or);opacity:0;z-index:6}
#tapB{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 4px rgba(255,122,24,.55);opacity:0;z-index:6}
/* ---- burbujas laterales ---- */
#side{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.msg{position:absolute;width:372px;opacity:0;font-size:29px;line-height:1.26;font-weight:600;will-change:transform}
.msg.e{left:12px;background:var(--card);color:var(--ink);border:3px solid rgba(61,122,32,.35);border-left:12px solid var(--green2);border-radius:30px 30px 30px 8px;padding:16px 22px 18px 20px;box-shadow:0 26px 60px -18px rgba(10,46,35,.4)}
.msg.e .who{display:flex;align-items:center;gap:10px;font:800 22px Archivo;color:var(--gd);margin-bottom:8px;letter-spacing:.5px}
.msg.e .who img{width:42px;height:42px;border-radius:50%;background:var(--chip);padding:2px}
.msg.e p+p{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.msg.u{right:12px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border-radius:30px 30px 8px 30px;padding:20px 26px;font-size:32px;font-weight:700;text-align:left;box-shadow:0 26px 60px -18px rgba(61,122,32,.7)}
.msg.u .who{font:800 20px Archivo;opacity:.85;margin-bottom:4px;letter-spacing:.5px}
.typing{position:absolute;left:12px;width:150px;height:78px;border-radius:30px 30px 30px 8px;background:var(--card);border:3px solid rgba(61,122,32,.35);box-shadow:0 20px 50px -18px rgba(10,46,35,.4);display:flex;align-items:center;justify-content:center;gap:12px;opacity:0}
.typing i{width:16px;height:16px;border-radius:50%;background:var(--green2)}
/* ---- tarjeta ff + wa ---- */
#ff{position:absolute;left:150px;right:150px;top:760px;padding:30px 34px;border-radius:40px;background:var(--card);color:var(--ink);border:3px solid var(--green2);box-shadow:0 50px 100px -20px rgba(10,46,35,.5);opacity:0;text-align:center}
#ff b{display:block;font:800 120px/1 Archivo;color:var(--gd)}
#ff span{display:block;font:700 32px "Instrument Sans";margin-top:8px}
#ff .pg{margin-top:20px;height:22px;border-radius:12px;background:var(--chip);overflow:hidden}
#ff .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--or))}
#ff .tags{margin-top:14px;font:700 26px "Instrument Sans";color:#C2560A}
#wa{position:absolute;left:210px;width:660px;top:560px;opacity:0;background:var(--card);color:var(--ink);border-radius:36px;border:4px solid var(--green2);box-shadow:0 60px 110px -20px rgba(10,46,35,.5);overflow:hidden;font-size:30px;line-height:1.3}
#wa .h{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;padding:26px 34px;font:800 40px Archivo}
#wa .h small{display:block;font:500 26px "Instrument Sans";opacity:.92;margin-top:4px}
#wa .t{padding:24px 34px 6px}
#wa .sep{border-top:3px dashed var(--line);margin:14px 0}
#wa .q{margin:10px 0;color:var(--ink)}
#wa .q span{display:block;color:var(--gd);font-weight:800;padding-left:24px}
#wa .q span.n{color:#C0392B}#wa .q span.d{color:#8a8a8a}
#wa .send{margin:18px 34px 28px;padding:20px;text-align:center;border-radius:50px;background:var(--green2);color:#fff;font:800 34px Archivo}
#sent{position:absolute;left:0;right:0;top:880px;text-align:center;opacity:0}
#sent div{display:inline-block;padding:30px 52px;border-radius:60px;background:var(--ink);color:var(--bg);font:800 48px Archivo;box-shadow:0 40px 80px rgba(10,46,35,.4)}
#sent b{color:var(--g)}
#cap{position:absolute;left:60px;right:60px;top:1590px;height:220px;display:flex;align-items:center;gap:30px;padding:0 40px;border-radius:44px;background:var(--card);border:3px solid var(--line);box-shadow:0 30px 70px -26px rgba(61,122,32,.45)}
#cap .n{flex:none;width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font:800 66px/116px Archivo;text-align:center}
#cap .x{color:var(--ink);font:800 52px/1.08 Archivo;letter-spacing:-1px}
#cap .x small{display:block;font:600 30px "Instrument Sans";color:var(--ink2);margin-top:8px;letter-spacing:0}
#chips{position:absolute;left:0;right:0;top:1150px}
.chip{position:absolute;left:100px;right:100px;height:104px;border-radius:52px;display:flex;align-items:center;gap:26px;padding:0 40px;font:800 42px Archivo;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 20px 40px -20px rgba(61,122,32,.5);opacity:0}
.chip i{flex:none;width:60px;height:60px;border-radius:50%;background:var(--green2);color:#fff;font:800 34px/60px Archivo;text-align:center;font-style:normal}
#end{position:absolute;inset:0;opacity:0;pointer-events:none}
#cta{cursor:pointer;border:0;pointer-events:auto;position:absolute;left:120px;right:120px;top:1130px;height:150px;border-radius:80px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font:800 46px Archivo;white-space:nowrap;display:flex;align-items:center;justify-content:center;box-shadow:0 34px 70px -20px rgba(61,122,32,.6)}
#nat{color:var(--ink);position:absolute;left:0;right:0;top:1340px;text-align:center;font:800 46px Archivo}
#nat em{font-style:normal;color:#C2560A}
#bar{position:absolute;left:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--green2),var(--or));width:0}
.back{transform-style:preserve-3d;background:linear-gradient(160deg,#ff9b4f 0%,#f4741d 50%,#d95b0c 100%)!important;box-shadow:inset 0 0 0 7px rgba(190,70,5,.55),inset 0 0 0 9px rgba(255,190,140,.4)!important}
.back>div{position:absolute}
.lip{left:12px;top:12px;width:426px;height:326px;border-radius:66px 66px 48px 48px;box-sizing:border-box;border:14px solid #f7842b}
.pl{left:26px;top:26px;width:398px;height:298px;border-radius:54px 54px 36px 36px;background:linear-gradient(170deg,#f7b07a,#ea914f 60%,#e0813c);box-shadow:inset 0 0 0 2px rgba(255,214,180,.5)}
.lw{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9b8,#f2b184 40%,#a95320 85%)}
.lr{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a5226,#3a1f0c 75%)}
.lg{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#566678 0,#161e27 38%,#05080b 72%);box-shadow:inset 0 0 0 5px #0b0f14,inset 0 0 14px rgba(120,160,220,.35)}
.lg i{position:absolute;left:22%;top:18%;width:22px;height:15px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.lsh{width:128px;height:128px;border-radius:50%;background:rgba(90,35,0,.38);filter:blur(9px);transform:translateZ(5.5px)}
.dt{border-radius:50%}

body.w #stage{left:0!important;top:190px!important;width:1920px!important;height:960px!important;transform:scale(.88);transform-origin:50% 0}
body.w #phone{left:735px!important}
body.w #gshadow{left:720px!important;top:1000px!important;width:480px}
body.w #side{width:1920px!important;height:1080px!important}
body.w .msg{width:440px!important;font-size:27px!important;line-height:1.22!important}
body.w .msg.e{left:240px!important}.msg.u{right:240px!important}
body.w .typing{left:250px!important}
body.w #ff{left:560px!important;right:560px!important;top:330px!important}
body.w #wa{left:510px!important;width:900px!important;top:250px!important;font-size:26px!important}
body.w #wa .h{font-size:36px!important;padding:20px 30px!important}
body.w #wa .t{column-count:2;column-gap:40px;padding:18px 30px 4px!important}
body.w #wa .q,body.w #wa .sep{break-inside:avoid}
body.w #wa .send{margin:12px 30px 22px!important;padding:16px!important;font-size:30px!important}
body.w #sent{top:470px!important}
body.w #cap{left:290px!important;right:540px!important;top:34px!important;height:150px!important;padding:0 34px!important;gap:22px!important;border-radius:36px!important}
body.w #cap .n{width:86px!important;height:86px!important;font:800 48px/86px Archivo!important}
body.w #cap .x{font-size:40px!important}
body.w #cap .x small{font-size:23px!important;margin-top:4px!important}
body.w #chips{left:1060px!important;right:auto!important;width:760px;top:250px!important}
body.w .chip{left:0!important;right:0!important;height:96px!important;font-size:40px!important}
body.w #cta{left:510px!important;right:510px!important;top:560px!important;height:120px!important;font-size:42px!important}
body.w #nat{top:730px!important;font-size:42px!important}
body.w #cap{right:290px!important}
</style></head>

    $('sent').style.opacity=seg(t,e.t+e.dur-1.1,e.t+e.dur-.6)*(1-seg(t,END+.2,END+.7));
  }});
  // chips
  [['c1',END+1.4],['c2',END+1.9],['c3',END+2.4],['c4',END+2.9]].forEach(([id,a])=>{const kk=eo(seg(t,a,a+.5)); $(id).style.opacity=kk*(1-seg(t,END+3.4,END+3.7)); $(id).style.transform='translateY('+lerp(50,0,kk)+'px)'});
  // titulos
  const fadeTop=1-seg(t,END+3.4,END+3.8);
  // caption
  const capEv=D.ev.filter(e=>t>=(e.tapT!==undefined?e.tapT:(e.typeT!==undefined?e.typeT:e.t))).slice(-1)[0];
  let key=capEv?capEv.cap:0;
  if(t<3.6) key=0;
  if($('cap').dataset.k!==String(key)){ $('cap').dataset.k=key;
    if(key===0){ $('capN').style.visibility='hidden'; $('capT').innerHTML='Diagnóstico con Ethan<small>Paso a paso, desde tu celular</small>'; }
    else { $('capN').style.visibility='visible'; $('capN').textContent=key; $('capT').innerHTML=D.caps[key][0]+'<small>'+D.caps[key][1]+'</small>'; } }
  $('cap').style.opacity=t>=END+.9?(1-seg(t,END+.9,END+1.2)):1;
  // end
  const e2=seg(t,END+3.7,END+4.4);
  $('end').style.opacity=e2;
}
window.setT=setT; window.TOT=TOT;


const au=$('au'), big=$('big'), pp=$('pp'), sk=$('sk'), skf=$('skf'), tm=$('tm');
let T=0, playing=false, ended=false, clock=false, lastTs=0, raf=0, shown=false;
const CROP_W={x:150,y:10,w:1690,h:1170}, CROP_V={x:0,y:380,w:1080,h:1620};
function layout(){
  const W=window.innerWidth; WIDE=W>=760; document.body.classList.toggle('w',WIDE);
  const c=WIDE?CROP_W:CROP_V, k=W/c.w;
  $('root').style.transform='scale('+k+') translate('+(-c.x)+'px,'+(-c.y)+'px)';
  setT(T);
}
function fmt(x){x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
function paint(){ setT(T); skf.style.width=(T/TOT*100)+'%'; tm.textContent=fmt(T)+' / '+fmt(TOT); const on=T>=END+3.7; $('end').style.pointerEvents=on?'auto':'none'; }
function tick(ts){
  if(!playing) return;
  if(clock||au.paused){ T+=Math.min(.1,(ts-lastTs)/1000); } else T=au.currentTime;
  lastTs=ts;
  if(T>=TOT-.05){ T=TOT; paint(); finish(); return; }
  paint(); raf=requestAnimationFrame(tick);
}
function play(){
  if(ended){ T=0; ended=false; }
  document.body.classList.add('started');
  try{ au.currentTime=T; }catch(e){}
  const p=au.play(); if(p&&p.catch) p.catch(()=>{clock=true;});
  playing=true; pp.textContent='❚❚'; pp.setAttribute('aria-label','Pausar'); lastTs=performance.now();
  if(!shown){ shown=true; parent.postMessage({type:'evplay'},'*'); }
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function pause(){ playing=false; try{au.pause();}catch(e){} pp.textContent='▶'; pp.setAttribute('aria-label','Reproducir'); cancelAnimationFrame(raf); }
function finish(){ ended=true; pause(); pp.textContent='↻'; pp.setAttribute('aria-label','Ver de nuevo'); }
pp.addEventListener('click',()=>{ if(playing) pause(); else play(); });
big.addEventListener('click',play);
sk.addEventListener('click',e=>{ const r=sk.getBoundingClientRect(); T=Math.max(0,Math.min(TOT-.1,(e.clientX-r.left)/r.width*TOT)); ended=false; try{au.currentTime=T;}catch(_){} paint(); });
$('cta').addEventListener('click',()=>parent.postMessage({type:'evcta'},'*'));
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='theme'){ THEME=d.v==='dark'?'dark':'light'; document.documentElement.dataset.theme=THEME; document.documentElement.style.colorScheme=THEME; setShots(); } else if(d.type==='pause'&&playing) pause(); });
const q=new URLSearchParams(location.search); THEME=q.get('theme')==='dark'?'dark':'light'; document.documentElement.dataset.theme=THEME; document.documentElement.style.colorScheme=THEME;
setShots(); window.addEventListener('resize',layout); T=3.9; layout(); paint();
window.__ev={seek:t=>{T=t;paint();},TOT,END};
</script></body></html>
