<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escena ECODESA</title>
<link rel="stylesheet" href="fiestas.css"><style>
body{margin:0;font-family:sans-serif}
.blk{position:relative;background:#c6e98a;padding-top:20px}
html[data-theme=dark] .blk{background:#0c2a12}
</style><style>:root{--es-sun:#ffd21f;--es-halo:.25;--es-rayo:.6;--es-moon:0;--es-stars:0;--es-cloud:1;--es-far:#a6d867;--es-farwin:#c4ea8c;--es-win:#fbfff2;--es-lamp:#fbfff2;--es-lampg:rgba(255,255,255,0)}
[data-theme=dark]{--es-sun:#eef7d8;--es-halo:.12;--es-rayo:0;--es-moon:1;--es-stars:1;--es-cloud:.12;--es-far:#123a1a;--es-farwin:#ffd970;--es-win:#ffd970;--es-lamp:#ffd21f;--es-lampg:rgba(255,200,40,.3)}
.es-bando{position:relative;height:clamp(280px,27vw,380px)}
.es-bando svg{display:block;width:100%;height:100%}
.es-bando *{transform-box:fill-box}
.es-bando .fi-flag{transform-box:view-box}
.es-ethan{animation:esFloat 2.2s ease-in-out infinite alternate}
@keyframes esFloat{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.es-beam{animation:esBeam 1.1s ease-in-out infinite alternate}
@keyframes esBeam{from{opacity:.15}to{opacity:.45}}
.es-rotor{transform-origin:50% 50%;animation:fiRays 5s linear infinite}
.es-puff{opacity:0;animation:esPuff 3.6s ease-out infinite}
@keyframes esPuff{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(26px,-50px) rotate(90deg)}}
.es-tree{transform-origin:50% 100%;animation:esTree 3s ease-in-out infinite alternate}
@keyframes esTree{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.es-route{transform-box:view-box!important;animation:esRoute 30s ease-in-out infinite}
@keyframes esRoute{0%,10%{transform:translate(150px,145px)}16%,26%{transform:translate(390px,115px)}32%,42%{transform:translate(600px,185px)}48%,58%{transform:translate(810px,165px)}64%,74%{transform:translate(1040px,155px)}80%,90%{transform:translate(1310px,195px)}100%{transform:translate(150px,145px)}}
.es-van{transform-box:view-box!important;animation:esVan 22s linear infinite}
@keyframes esVan{from{transform:translateX(-120px)}to{transform:translateX(1720px)}}
.es-write{transform-origin:0 0;animation:esWrite .5s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes esWrite{from{transform:rotate(-4deg)}to{transform:rotate(5deg) translateY(2px)}}
.es-point{transform-origin:0 0;animation:esPoint 1.6s ease-in-out infinite alternate}
@keyframes esPoint{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.es-nod{transform-origin:50% 100%;animation:esNod 2.4s ease-in-out infinite}
@keyframes esNod{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.es-look{animation:esLook 2.8s ease-in-out infinite alternate}
@keyframes esLook{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
</style></head><body>
<div class="blk"><div class="es-bando" id="sc"></div></div>
<script src="eco-scene.js"></script><script>document.getElementById('sc').innerHTML=ecoScene();</script>
</body></html>
